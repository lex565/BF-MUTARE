  <!-- BF Mutare, horizontal lockup. Transparent ground — no plate, no box.
       This is the standalone file for anything outside the website: social
       profile headers, an email signature, a letterhead, a windscreen sticker.

       The mark is the client's own artwork, traced from
       Images/bfmutarewhite_102403.png. `public/logo-mark.svg` is the same
       mountain without the wordmark, for square crops like a profile picture.

       The wordmark is live text with a system stack behind Archivo, so it
       stays editable. The trade is that a machine without Archivo falls back
       to Helvetica or Arial and the spacing shifts slightly — for print, or
       anywhere the exact letterforms matter, convert the text to outlines
       first.

       "BF" is set in the site's off-white and will disappear on a white page.
       On light ground, recolour that tspan to #131210 or use logo-mark.svg on
       its own. -->
